[package]
name = "english-spell"
version = "0.1.0"
description = "English spelling popup"
authors = ["muluo"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between lib and bin on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "english_spell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
