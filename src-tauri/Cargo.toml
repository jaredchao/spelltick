[package]
name = "spelltick"
version = "0.1.0"
description = "Spelltick spelling reminders"
authors = ["muluo"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between lib and bin on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "spelltick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
fastrand = "2"
chrono = "0.4"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-http = "2"
arboard = "3"
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }
