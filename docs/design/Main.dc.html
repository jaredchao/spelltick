<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>A 原生极简</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2563EB}a:hover{color:#1D4ED8}
input:focus{outline:none}
</style>
</helmet>
<div style="width: 1240px; height: 540px; box-sizing: border-box; padding: 56px; background: #E9EBEF; font-family: Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #111827; display: flex; gap: 48px; align-items: flex-start">

<div style="display: flex; flex-direction: column; gap: 14px; width: 260px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #4B5563">收起 · 不抢焦点</div>
<button style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 48px; background: #FFFFFF; border: 1px solid #D9DCE1; border-radius: 999px; box-shadow: 0 6px 20px rgba(17,24,39,0.10); font-family: inherit; font-size: 14px; color: #111827; cursor: pointer; text-align: left">
<span style="width: 8px; height: 8px; border-radius: 50%; background: {{accent}}"></span>
<span style="flex: 1; font-weight: 500">来一题？</span>
<span style="font-size: 12px; color: #4B5563; background: #F3F4F6; border-radius: 6px; padding: 3px 7px">⌘⇧E</span>
</button>
<div style="font-size: 12px; color: #4B5563; line-height: 1.6">30 秒无操作自动收起</div>
</div>

<div style="display: flex; flex-direction: column; gap: 14px; width: 380px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #4B5563">答题</div>
<div style="background: #FFFFFF; border: 1px solid #D9DCE1; border-radius: 14px; box-shadow: 0 12px 32px rgba(17,24,39,0.14); padding: 22px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 12px; color: #4B5563">程序员英语 · 看中文写英文</span>
<button aria-label="播放发音" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #E5E7EB; background: #F9FAFB; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #374151">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a10 10 0 0 1 0 14"></path></svg>
</button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 26px; font-weight: 600">部署；展开</div>
<div style="font-size: 13px; color: #4B5563">v. · 6 个字母 · 首字母 d</div>
</div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: #4B5563">输入拼写
<input value="deplo" readonly style="height: 46px; box-sizing: border-box; border: 2px solid {{accent}}; border-radius: 10px; padding: 0 14px; font-family: inherit; font-size: 18px; letter-spacing: 0.04em; color: #111827; background: #FFFFFF">
</label>
<div style="display: flex; gap: 10px">
<button style="flex: 1; height: 44px; border-radius: 10px; border: 1px solid #D9DCE1; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #374151; cursor: pointer">提示</button>
<button style="flex: 1; height: 44px; border-radius: 10px; border: 1px solid #D9DCE1; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #374151; cursor: pointer">跳过</button>
<button style="flex: 1.4; height: 44px; border-radius: 10px; border: none; background: {{accent}}; font-family: inherit; font-size: 14px; font-weight: 600; color: #FFFFFF; cursor: pointer">提交 ↵</button>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 14px; width: 380px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #4B5563">反馈 · 拼错时</div>
<div style="background: #FFFFFF; border: 1px solid #D9DCE1; border-radius: 14px; box-shadow: 0 12px 32px rgba(17,24,39,0.14); padding: 22px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #B42318">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M9 9l6 6M15 9l-6 6"></path></svg>
差一点
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; color: #4B5563">你的拼写</div>
<div style="font-size: 22px; letter-spacing: 0.06em">depl<span style="background: #FDE2E1; color: #B42318; border-radius: 4px; padding: 0 2px">yo</span></div>
<div style="font-size: 13px; color: #4B5563">正确</div>
<div style="font-size: 22px; font-weight: 600; letter-spacing: 0.06em">depl<span style="background: #DCFCE7; color: #067647; border-radius: 4px; padding: 0 2px">oy</span> <span style="font-size: 14px; font-weight: 400; color: #4B5563; letter-spacing: 0">/dɪˈplɔɪ/</span></div>
</div>
<div style="font-size: 14px; line-height: 1.6; color: #374151; background: #F9FAFB; border-radius: 10px; padding: 12px 14px">We <b>deploy</b> to production every Friday.</div>
<div style="font-size: 13px; line-height: 1.6; color: #374151; display: flex; gap: 8px"><span style="flex: none; font-size: 11px; font-weight: 600; color: #FFFFFF; background: #6D28D9; border-radius: 5px; padding: 2px 6px; height: 16px; line-height: 16px">AI</span><span>-oy 结尾同 employ、destroy，记成「de + ploy」。</span></div>
<div style="display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #4B5563">
<span>10 分钟后再考</span>
<span>按任意键继续</span>
</div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2563EB","options":["#2563EB","#0F766E","#7C3AED","#111827"]},"$preview":{"width":1240,"height":540}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#2563EB' };
}
}
</script>
</body>
</html>
