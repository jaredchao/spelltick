<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>C 纸感词卡</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F3A5F}a:hover{color:#152A45}
input:focus{outline:none}
</style>
</helmet>
<div style="width: 1240px; height: 540px; box-sizing: border-box; padding: 56px; background: #EDE6DA; font-family: Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #2A241C; display: flex; gap: 48px; align-items: flex-start">

<div style="display: flex; flex-direction: column; gap: 14px; width: 260px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #6B5E4B">收起 · 不抢焦点</div>
<button style="display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 10px; min-height: 52px; background: #FBF8F2; border: 1px solid #E2D8C7; border-radius: 14px; box-shadow: 0 6px 18px rgba(60,45,25,0.12); font-family: inherit; font-size: 14px; color: #2A241C; cursor: pointer; text-align: left">
<span style="width: 32px; height: 32px; border-radius: 9px; background: {{accent}}; color: #FBF8F2; font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center">A</span>
<span style="flex: 1; font-weight: 500">一张新词卡</span>
<span style="font-size: 12px; color: #6B5E4B">⌘⇧E</span>
</button>
<div style="font-size: 12px; color: #6B5E4B; line-height: 1.6">30 秒无操作自动收起</div>
</div>

<div style="display: flex; flex-direction: column; gap: 14px; width: 380px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #6B5E4B">答题</div>
<div style="background: #FBF8F2; border: 1px solid #E2D8C7; border-radius: 18px; box-shadow: 0 14px 34px rgba(60,45,25,0.16); padding: 26px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 12px; color: #6B5E4B">No. 128 · 程序员英语</span>
<button aria-label="播放发音" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #E2D8C7; background: #F4EEE3; color: {{accent}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a10 10 0 0 1 0 14"></path></svg>
</button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; align-items: center; padding: 6px 0">
<div style="font-size: 28px; font-weight: 600; letter-spacing: 0.04em">部署；展开</div>
<div style="font-family: 'Source Serif 4', Georgia, serif; font-style: italic; font-size: 15px; color: #6B5E4B">verb · 6 letters</div>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #6B5E4B">拼写
<input value="deplo" readonly style="height: 48px; border: none; border-bottom: 2px solid {{accent}}; background: transparent; font-family: 'Source Serif 4', Georgia, serif; font-size: 26px; text-align: center; letter-spacing: 0.12em; color: #2A241C">
</label>
<div style="display: flex; gap: 10px">
<button style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #E2D8C7; background: transparent; font-family: inherit; font-size: 14px; color: #4A3F30; cursor: pointer">提示</button>
<button style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #E2D8C7; background: transparent; font-family: inherit; font-size: 14px; color: #4A3F30; cursor: pointer">跳过</button>
<button style="flex: 1.4; height: 44px; border-radius: 12px; border: none; background: {{accent}}; font-family: inherit; font-size: 14px; font-weight: 600; color: #FBF8F2; cursor: pointer">翻面 ↵</button>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 14px; width: 380px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #6B5E4B">反馈 · 卡片背面</div>
<div style="background: #FBF8F2; border: 1px solid #E2D8C7; border-radius: 18px; box-shadow: 0 14px 34px rgba(60,45,25,0.16); padding: 26px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 34px; font-weight: 700; letter-spacing: 0.02em">depl<span style="color: #C2410C; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px">oy</span></div>
<span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; color: #6B5E4B">/dɪˈplɔɪ/</span>
</div>
<div style="font-size: 13px; color: #6B5E4B">你写的是 <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 16px; color: #2A241C">depl<span style="color: #C2410C; text-decoration: line-through">yo</span></span> — 最后两个字母顺序反了</div>
<div style="font-family: 'Source Serif 4', Georgia, serif; font-style: italic; font-size: 16px; line-height: 1.55; color: #3A3127; border-top: 1px dashed #D6CAB5; border-bottom: 1px dashed #D6CAB5; padding: 12px 0">“We deploy to production every Friday.”</div>
<div style="font-size: 13px; line-height: 1.6; color: #4A3F30"><span style="font-weight: 600; color: {{accent}}">AI 小记</span>　-oy 结尾同 employ、destroy，记成「de + ploy」。</div>
<div style="display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #6B5E4B">
<span>10 分钟后再见</span>
<span>按任意键继续</span>
</div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F3A5F","options":["#1F3A5F","#2F5D50","#7A2E2E","#3B3B3B"]},"$preview":{"width":1240,"height":540}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#1F3A5F' };
}
}
</script>
</body>
</html>
