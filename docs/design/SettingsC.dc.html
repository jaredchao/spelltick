<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>C 设置 通用</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F3A5F}a:hover{color:#152A45}
input:focus{outline:2px solid #9DB2CC;outline-offset:1px}
</style>
</helmet>
<div style="width: 1240px; height: 720px; box-sizing: border-box; padding: 48px; background: #EDE6DA; font-family: Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #2A241C; display: flex; gap: 56px; align-items: flex-start">

<div style="width: 820px; height: 624px; background: #FBF8F2; border: 1px solid #E2D8C7; border-radius: 18px; box-shadow: 0 16px 40px rgba(60,45,25,0.16); display: flex; flex-direction: column; overflow: hidden">
<div style="height: 48px; flex: none; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #EAE1D2; font-family: 'Source Serif 4', Georgia, serif; font-size: 16px; font-weight: 600">设置</div>
<div style="flex: 1; display: flex; min-height: 0">
<nav style="width: 176px; flex: none; background: #F4EEE3; border-right: 1px solid #EAE1D2; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px">
<button style="height: 40px; border: none; border-radius: 10px; background: #FBF8F2; box-shadow: 0 1px 3px rgba(60,45,25,0.12); text-align: left; padding: 0 12px; font-family: inherit; font-size: 14px; font-weight: 600; color: {{accent}}; cursor: pointer">通用</button>
<button style="height: 40px; border: none; border-radius: 10px; background: transparent; text-align: left; padding: 0 12px; font-family: inherit; font-size: 14px; color: #4A3F30; cursor: pointer">出题</button>
<button style="height: 40px; border: none; border-radius: 10px; background: transparent; text-align: left; padding: 0 12px; font-family: inherit; font-size: 14px; color: #4A3F30; cursor: pointer">词库与 AI</button>
<button style="height: 40px; border: none; border-radius: 10px; background: transparent; text-align: left; padding: 0 12px; font-family: inherit; font-size: 14px; color: #4A3F30; cursor: pointer">关于</button>
</nav>
<div style="flex: 1; padding: 22px 30px; display: flex; flex-direction: column; gap: 20px">

<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; font-weight: 600">皮肤</h2>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<button style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 1px solid #E2D8C7; border-radius: 12px; background: #FFFFFF; font-family: inherit; cursor: pointer; text-align: left">
<span style="height: 64px; border-radius: 8px; background: #E9EBEF; display: flex; align-items: center; justify-content: center"><span style="width: 70%; height: 36px; border-radius: 6px; background: #FFFFFF; border: 1px solid #D9DCE1; display: flex; align-items: flex-end; padding: 5px; box-sizing: border-box"><span style="width: 40%; height: 6px; border-radius: 3px; background: #2563EB"></span></span></span>
<span style="font-size: 13px; color: #2A241C">原生极简</span>
</button>
<button style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 1px solid #E2D8C7; border-radius: 12px; background: #FFFFFF; font-family: inherit; cursor: pointer; text-align: left">
<span style="height: 64px; border-radius: 8px; background: #0B0D10; display: flex; align-items: center; justify-content: center"><span style="width: 70%; height: 36px; border-radius: 4px; background: #14171C; border: 1px solid #262B33; display: flex; align-items: flex-end; padding: 5px; box-sizing: border-box"><span style="width: 40%; height: 6px; border-radius: 1px; background: #7EE787"></span></span></span>
<span style="font-size: 13px; color: #2A241C">终端代码</span>
</button>
<button aria-pressed="true" style="display: flex; flex-direction: column; gap: 8px; padding: 7px; border: 2px solid {{accent}}; border-radius: 12px; background: #FFFFFF; font-family: inherit; cursor: pointer; text-align: left">
<span style="height: 64px; border-radius: 8px; background: #EDE6DA; display: flex; align-items: center; justify-content: center"><span style="width: 70%; height: 36px; border-radius: 8px; background: #FBF8F2; border: 1px solid #E2D8C7; display: flex; align-items: flex-end; padding: 5px; box-sizing: border-box"><span style="width: 40%; height: 6px; border-radius: 3px; background: #1F3A5F"></span></span></span>
<span style="font-size: 13px; font-weight: 600; color: {{accent}}">纸感词卡 ✓</span>
</button>
<button style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 1px solid #E2D8C7; border-radius: 12px; background: #FFFFFF; font-family: inherit; cursor: pointer; text-align: left">
<span style="height: 64px; border-radius: 8px; overflow: hidden; display: flex"><span style="flex: 1; background: #E9EBEF"></span><span style="flex: 1; background: #0B0D10"></span></span>
<span style="font-size: 13px; color: #2A241C">跟随系统</span>
</button>
</div>
<div style="font-size: 12px; color: #6B5E4B">「跟随系统」：浅色用原生极简，深色用终端代码</div>
</section>

<div style="height: 1px; background: #EAE1D2"></div>

<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; font-weight: 600">快捷键</h2>
<div style="display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: #4A3F30">
<span>唤出答题</span>
<button style="height: 34px; min-width: 96px; padding: 0 12px; border: 1px solid #E2D8C7; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 13px; color: #2A241C; cursor: pointer">⌘ ⇧ E</button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: #4A3F30">
<span>选中文字加入生词本</span>
<button style="height: 34px; min-width: 96px; padding: 0 12px; border: 1px solid #E2D8C7; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 13px; color: #2A241C; cursor: pointer">⌘ ⇧ A</button>
</div>
</section>

<div style="height: 1px; background: #EAE1D2"></div>

<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; font-weight: 600">启动与数据</h2>
<label style="display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: #4A3F30">开机自动启动
<input type="checkbox" role="switch" checked style="width: 18px; height: 18px; accent-color: {{accent}}"></label>
<div style="display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: #4A3F30">
<span>学习进度（换电脑时用）</span>
<div style="display: flex; gap: 8px">
<button style="height: 36px; padding: 0 14px; border: 1px solid #E2D8C7; border-radius: 10px; background: transparent; font-family: inherit; font-size: 13px; color: #2A241C; cursor: pointer">导入</button>
<button style="height: 36px; padding: 0 14px; border: none; border-radius: 10px; background: {{accent}}; font-family: inherit; font-size: 13px; font-weight: 600; color: #FBF8F2; cursor: pointer">导出</button>
</div>
</div>
</section>

</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; width: 268px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #6B5E4B">托盘菜单</div>
<div role="menu" aria-label="托盘菜单" style="background: #FBF8F2; border: 1px solid #E2D8C7; border-radius: 14px; box-shadow: 0 12px 32px rgba(60,45,25,0.18); padding: 6px; display: flex; flex-direction: column">
<div style="padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px dashed #D6CAB5; margin-bottom: 4px">
<div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 16px; font-weight: 600">下一张卡 · 约 12 分钟</div>
<div style="font-size: 12px; color: #6B5E4B">今日 18 张 · 正确率 83%</div>
</div>
<button role="menuitem" style="height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border: none; border-radius: 9px; background: {{accent}}; font-family: inherit; font-size: 14px; color: #FBF8F2; cursor: pointer"><span>立即来一张</span><span style="font-size: 12px">⌘⇧E</span></button>
<button role="menuitem" style="height: 38px; display: flex; align-items: center; padding: 0 12px; border: none; border-radius: 9px; background: transparent; font-family: inherit; font-size: 14px; color: #2A241C; cursor: pointer">暂停 1 小时</button>
<button role="menuitem" style="height: 38px; display: flex; align-items: center; padding: 0 12px; border: none; border-radius: 9px; background: transparent; font-family: inherit; font-size: 14px; color: #2A241C; cursor: pointer">今天不再弹</button>
<div style="height: 1px; background: #EAE1D2; margin: 4px 6px"></div>
<button role="menuitem" style="height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border: none; border-radius: 9px; background: transparent; font-family: inherit; font-size: 14px; color: #2A241C; cursor: pointer"><span>加入生词…</span><span style="font-size: 12px; color: #6B5E4B">⌘⇧A</span></button>
<button role="menuitem" style="height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border: none; border-radius: 9px; background: transparent; font-family: inherit; font-size: 14px; color: #2A241C; cursor: pointer"><span>设置…</span><span style="font-size: 12px; color: #6B5E4B">⌘,</span></button>
<div style="height: 1px; background: #EAE1D2; margin: 4px 6px"></div>
<button role="menuitem" style="height: 38px; display: flex; align-items: center; padding: 0 12px; border: none; border-radius: 9px; background: transparent; font-family: inherit; font-size: 14px; color: #2A241C; cursor: pointer">退出</button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F3A5F","options":["#1F3A5F","#2F5D50","#7A2E2E","#3B3B3B"]},"$preview":{"width":1240,"height":720}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#1F3A5F' };
}
}
</script>
</body>
</html>
